# Verifica que ninguna ficha de docs/features/ deje un requisito sin validación declarada,
# y que los tests prometidos existan cuando la ficha dice estar Verificada.
#
# Se ejecuta en CI a propósito: el agente que rellena las tablas es el mismo que las cumpliría,
# así que la comprobación tiene que vivir donde no pueda saltársela.

name: Cobertura

on:
  pull_request:
  push:
    branches: [main]

# El script solo lee archivos: no necesita escribir en el repositorio ni tocar nada
# de la API. Acotarlo aquí limita el daño si una de las acciones se viera comprometida.
permissions:
  contents: read

jobs:
  verificar:
    name: Tablas de cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Sin caché: desde la v5, setup-node cachea solo si hay `packageManager`, y aquí no se instala pnpm.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # Sin dependencias: el script usa solo módulos nativos de Node.
      - run: node scripts/verificar-cobertura.mjs
